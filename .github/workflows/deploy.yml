name: TaskFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/

  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate backend files
        run: |
          test -f backend/manage.py
          test -f backend/requirements.txt
          echo "Backend files verified"

  deploy:
    if: github.event_name == 'push'
    needs: [frontend-build, backend-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/taskflow_key
          chmod 600 ~/.ssh/taskflow_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          SSH="ssh -i ~/.ssh/taskflow_key -o IdentitiesOnly=yes"

          # Update backend source without replacing production data/config.
          rsync -az --delete \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='db.sqlite3' \
            --exclude='staticfiles/' \
            -e "$SSH" \
            backend/ "$EC2_USER@$EC2_HOST:/home/ubuntu/taskflow/backend/"

          # Upload the already-built frontend.
          rsync -az --delete \
            -e "$SSH" \
            client/dist/ "$EC2_USER@$EC2_HOST:/tmp/taskflow-frontend/"

          # Install dependencies, apply migrations, collect static files,
          # publish frontend and restart the existing service.
          $SSH "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -e
          cd /home/ubuntu/taskflow/backend

          ./venv/bin/pip install -r requirements.txt
          ./venv/bin/python manage.py migrate --noinput
          ./venv/bin/python manage.py collectstatic --noinput

          sudo rsync -az --delete /tmp/taskflow-frontend/ /var/www/taskflow/
          sudo systemctl restart taskflow
          sudo
